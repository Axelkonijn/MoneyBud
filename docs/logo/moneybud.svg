    <path d="M78.8 150 A45 45 0 0 0 78.8 210" fill="none" stroke="#FFF1D9" stroke-width="7" opacity="0.85"/>
    <g fill="none" stroke="#8A5A1C" stroke-width="10">
      <path d="M138.9 160.1 A27.3 27.3 0 1 0 138.9 199.9"/>
