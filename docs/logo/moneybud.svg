    <path d="M172 98 C142.6 127.2 160.5 161.9 202 170 C210.7 145.2 197.2 108.6 172 98 Z"/>
    <path d="M172 98 C147.7 83 127 100.8 128 130 C146.1 131.8 168.8 116.7 172 98 Z"/>
  </g>

  <g stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
