<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 40 236 236" width="236" height="236">
  <!-- MoneyBud's logo: a gold coin with a sprout, drawn as a die-cut sticker to sit among the
       stickers on Axel's home screen (Niagara's sticker icons). The source of every icon made from
       it: render.ps1 makes the Android launcher icon and the Windows .ico. Stem, leaves and coin
       are drawn twice: first fat, in sticker paper, for the cut edge; then in colour on top. The
       stem is an outline, 22 wide where it leaves the coin and 8 at the leaves, thinning fast;
       both leaves lie in front of the coin, the small one on top. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- The sticker paper -->
  <g filter="url(#shadow)" fill="#F3EFE6" stroke="#F3EFE6" stroke-width="30" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="116" cy="180" r="60"/>
